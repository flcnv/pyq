# Weekly update PRs. Actions are pinned to commit SHAs in ci.yml; Dependabot bumps the SHA and the
# version comment together.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly

  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    groups:
      python:
        patterns: ["*"]
