[project]
name = "swiss-invoice-api"
version = "0.1.0"
requires-python = ">=3.15"
dependencies = [
    "alembic>=1.20.1",
    "anthropic>=2.12.0",
    "asyncpg>=0.32.0",
    "fastapi>=0.165.0",
    "fpdf2>=2.9.0",
    "opencv-python-headless>=5.1.0.95",
    "pillow>=13.0.0",
    "pydantic>=2.14.4",
    "pydantic-settings>=2.16.3",
    "pypdfium2>=5.15.2",
    "python-multipart>=0.0.34",
    "redis>=8.1.0",
    "segno>=1.6.6",
    "sqlalchemy[asyncio]>=2.1.9",
    "uvicorn>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.6",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.coverage.run]
source = ["src"]
branch = true

[tool.mypy]
packages = ["src"]
python_version = "3.15"
strict = true
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pypdfium2.*"]  # ships no type information
ignore_missing_imports = true

[tool.ruff]
src = ["."]
target-version = "py315"
line-length = 100
extend-exclude = ["migrations/versions"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF", "ASYNC", "PT", "N", "S", "DTZ"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S311"]  # asserts; seeded randomness for jitter tests
"scripts/**" = ["S101", "S311", "S310"]  # dev tooling: asserts, seeded noise; URLs checked

[tool.ruff.lint.isort]
known-first-party = ["src"]
